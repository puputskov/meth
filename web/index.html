<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meth</title>
<meta name="description" content="A notebook for mathematics: exact arithmetic, algebra, calculus, matrices, logic and proofs.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/workspace.css">
<link rel="stylesheet" href="css/notebook.css">
<link rel="stylesheet" href="css/help.css">
</head>
<body class="app">
<header class="bar">
	<button class="tool toggle" data-act="sidebar" title="Files (Ctrl+B)" aria-label="Show or hide the files" aria-pressed="true">☰</button>
	<a class="brand" href="./" aria-label="meth">meth</a>
	<span class="title" id="title" title="Double click to rename"></span>
	<nav class="tools" aria-label="Notebook">
		<details class="menu" id="menu-file">
			<summary>File</summary>
			<div class="popup">
				<button data-act="new-file">New file</button>
				<button data-act="new-folder">New folder</button>
				<button data-act="open">Open files…</button>
				<hr>
				<button data-act="rename">Rename</button>
				<button data-act="close">Close tab</button>
				<button data-act="delete">Delete file</button>
				<hr>
				<button data-act="save">Download as .meth</button>
				<button data-act="export-latex">Export LaTeX</button>
				<button data-act="export-mathml">Export HTML + MathML</button>
				<button data-act="export-markdown">Export Markdown</button>
			</div>
		</details>
		<details class="menu" id="menu-insert">
			<summary>Examples</summary>
			<div class="popup wide" id="examples-popup"></div>
		</details>
		<details class="menu" id="menu-snippets">
			<summary>Snippets</summary>
			<div class="popup wide" id="snippets-popup"></div>
		</details>
		<button class="tool" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
		<button class="tool" data-act="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
		<button class="tool toggle" data-act="symbols" title="Names without a value stay symbols" aria-pressed="false">symbols</button>
		<button class="tool" data-act="theme" title="Colour theme" aria-label="Colour theme">◐</button>
		<button class="tool" data-act="tutorial" title="Learn meth by doing">tutorial</button>
		<button class="tool" data-act="help" title="Help (F1)" aria-label="Help">?</button>
	</nav>
</header>
<div id="shell" class="shell">
	<aside id="explorer" class="explorer" aria-label="Files"></aside>
	<div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the files"></div>
	<section class="workarea">
		<div id="tutorial" class="tutorial" aria-label="Tutorial" hidden></div>
		<div id="tabs" class="tabs"></div>
		<div id="panes" class="panes"></div>
	</section>
</div>
<aside id="help" class="help" aria-label="Help" hidden></aside>
<input type="file" id="file-input" accept=".meth,text/plain" multiple hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
